[project]
name = "prospective-memory"
version = "0.6.0"
description = "Phone-first capture + JARVIS pull (OTP, WhatsApp, mail) via MCP. Sibling of google-activity-assistant, not a Takeout feature."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
pmem = "prospective_memory.cli:app"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
