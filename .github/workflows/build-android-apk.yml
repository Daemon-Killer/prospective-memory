name: Build & Release Remy Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'reminder app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'reminder app/package-lock.json'

      - name: Install dependencies
        working-directory: 'reminder app'
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: 'reminder app'
        run: npm run typecheck

      - name: Grant execute permission for gradlew
        working-directory: 'reminder app/android'
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: 'reminder app/android'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remy-release-apk
          path: reminder app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (Rolling Latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Remy Mobile Latest Release"
          body: "Automated rolling release containing the latest compiled APK for Remy Mobile."
          draft: false
          prerelease: false
          files: reminder app/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
